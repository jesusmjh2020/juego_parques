<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego de Parquess</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script></head><body><main><header><h1>🎲 Juego de Parquess</h1><span id="conn">Conectando…</span></header><section id="entry" class="panel"><p>Escribe tu nombre para entrar a la sala multijugador.</p><input id="name" placeholder="Tu nombre" maxlength="24"><button id="join">Entrar</button><p class="muted">Comparte este enlace con tus compañeros. Máximo 4 jugadores.</p></section><section id="game" hidden><div class="panel"><h2 id="who">Tu jugador</h2><p id="status">Esperando jugadores…</p><div id="players"></div><h2 id="dice">🎲 🎲</h2><button id="start" hidden>Iniciar partida</button><button id="roll" disabled>Lanzar dados</button><button id="pass" disabled>Pasar turno</button><p id="notice"></p></div><div class="panel"><h2>Fichas</h2><p>Cuando sea tu turno, lanza los dados y selecciona una ficha para moverla.</p><div id="tokens"></div></div></section></main><script src="/static/game.js"></script></body></html>
